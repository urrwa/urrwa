<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E1A"/>
      <stop offset="38%" stop-color="#3B0F1E"/>
      <stop offset="68%" stop-color="#5C1A2B"/>
      <stop offset="100%" stop-color="#6B4226"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E8B4BC" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#E8B4BC" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E8B4BC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6E9DE"/>
      <stop offset="55%" stop-color="#F0D2C9"/>
      <stop offset="100%" stop-color="#D9A66B"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <g id="sparkle">
      <path d="M0,-9 C0.8,-3 3,-0.8 9,0 C3,0.8 0.8,3 0,9 C-0.8,3 -3,0.8 -9,0 C-3,-0.8 -0.8,-3 0,-9 Z" fill="#E8C9A0"/>
    </g>
    <g id="sparkleSmall">
      <path d="M0,-5 C0.5,-1.6 1.6,-0.5 5,0 C1.6,0.5 0.5,1.6 0,5 C-0.5,1.6 -1.6,0.5 -5,0 C-1.6,-0.5 -0.5,-1.6 0,-5 Z" fill="#E8B4BC"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- subtle grain of tiny dots for texture -->
  <g opacity="0.12">
    <circle cx="80" cy="60" r="1.4" fill="#F5E8DC"/>
    <circle cx="160" cy="140" r="1" fill="#F5E8DC"/>
    <circle cx="1120" cy="80" r="1.4" fill="#F5E8DC"/>
    <circle cx="1050" cy="230" r="1" fill="#F5E8DC"/>
    <circle cx="240" cy="250" r="1" fill="#F5E8DC"/>
    <circle cx="980" cy="150" r="1.2" fill="#F5E8DC"/>
  </g>

  <!-- outer ornamental frame -->
  <rect x="18" y="18" width="1164" height="284" rx="6" fill="none" stroke="#D9A66B" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- corner flourishes -->
  <g stroke="#E8B4BC" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M34,60 Q34,34 60,34"/>
    <path d="M1166,60 Q1166,34 1140,34"/>
    <path d="M34,260 Q34,286 60,286"/>
    <path d="M1166,260 Q1166,286 1140,286"/>
  </g>
  <use href="#sparkleSmall" x="60" y="34"/>
  <use href="#sparkleSmall" x="1140" y="34"/>
  <use href="#sparkleSmall" x="60" y="286"/>
  <use href="#sparkleSmall" x="1140" y="286"/>

  <!-- scattered sparkles -->
  <use href="#sparkle" x="120" y="90" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.6s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkleSmall" x="200" y="200" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkle" x="1080" y="230" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.2s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkleSmall" x="1010" y="90" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.1s" repeatCount="indefinite"/>
  </use>
  <use href="#sparkleSmall" x="150" y="255" opacity="0.6"/>
  <use href="#sparkleSmall" x="1055" y="60" opacity="0.6"/>

  <!-- eyebrow tag -->
  <g font-family="Georgia, 'Times New Roman', serif" letter-spacing="6">
    <text x="600" y="105" text-anchor="middle" font-size="14" fill="#E8B4BC" opacity="0.9">W E L C O M E &#160; T O &#160; M Y &#160; C O R N E R</text>
  </g>
  <use href="#sparkleSmall" x="378" y="100"/>
  <use href="#sparkleSmall" x="822" y="100"/>

  <!-- name -->
  <text x="600" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="url(#nameGrad)" letter-spacing="3" filter="url(#softShadow)">Urwah Imtiaz</text>

  <!-- divider -->
  <g stroke="#D9A66B" stroke-width="1.2" opacity="0.8">
    <line x1="430" y1="205" x2="555" y2="205"/>
    <line x1="645" y1="205" x2="770" y2="205"/>
  </g>
  <use href="#sparkleSmall" x="600" y="205"/>

  <!-- subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="27" fill="#F0D2C9">Creative Frontend Developer</text>

  <!-- tagline -->
  <text x="600" y="272" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="2" fill="#C9A66B">React &#183; Next.js &#183; GSAP &#183; Three.js &#183; WebGL</text>
</svg>
