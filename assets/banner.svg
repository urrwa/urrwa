<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0810"/>
      <stop offset="35%" stop-color="#33101C"/>
      <stop offset="70%" stop-color="#5C1A2B"/>
      <stop offset="100%" stop-color="#5A3620"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5E9DE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5E9DE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6E9DE"/>
      <stop offset="55%" stop-color="#F0C9C2"/>
      <stop offset="100%" stop-color="#D9A66B"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <g id="star4">
      <path d="M0,-8 C0.7,-2.6 2.6,-0.7 8,0 C2.6,0.7 0.7,2.6 0,8 C-0.7,2.6 -2.6,0.7 -8,0 C-2.6,-0.7 -0.7,-2.6 0,-8 Z" fill="#E8C9A0"/>
    </g>
    <g id="star4s">
      <path d="M0,-4.5 C0.4,-1.4 1.4,-0.4 4.5,0 C1.4,0.4 0.4,1.4 0,4.5 C-0.4,1.4 -1.4,0.4 -4.5,0 C-1.4,-0.4 -0.4,-1.4 0,-4.5 Z" fill="#E8B4BC"/>
    </g>
  </defs>

  <!-- night sky background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- tiny star field -->
  <g fill="#F5E9DE">
    <circle cx="70" cy="50" r="1.3" opacity="0.7"/>
    <circle cx="140" cy="110" r="1" opacity="0.5"/>
    <circle cx="230" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="320" cy="150" r="1" opacity="0.4"/>
    <circle cx="980" cy="55" r="1.3" opacity="0.7"/>
    <circle cx="1060" cy="120" r="1" opacity="0.5"/>
    <circle cx="1140" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="1100" cy="270" r="1" opacity="0.4"/>
    <circle cx="60" cy="270" r="1.1" opacity="0.5"/>
    <circle cx="170" cy="245" r="1" opacity="0.4"/>
  </g>

  <!-- crescent moon, top-left -->
  <g transform="translate(95,64)">
    <circle r="30" fill="url(#moonGlow)"/>
    <path d="M10,-16 A17,17 0 1 0 10,16 A13,13 0 1 1 10,-16 Z" fill="#F0E4D4"/>
  </g>

  <!-- drifting sparkles -->
  <use href="#star4" x="230" y="90" opacity="0.9">
    <animate attributeName="opacity" values="0.35;0.95;0.35" dur="3.4s" repeatCount="indefinite"/>
  </use>
  <use href="#star4s" x="990" y="200" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="1090" y="240" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/>
  </use>
  <use href="#star4s" x="150" y="200" opacity="0.7">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3s" repeatCount="indefinite"/>
  </use>

  <!-- dangling cute spider, gentle idle sway -->
  <g transform="translate(860,0)">
    <line x1="0" y1="0" x2="0" y2="86" stroke="#C9A66B" stroke-width="1" opacity="0.55"/>
    <g transform="translate(0,86)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-7;7;-7" dur="3.2s" repeatCount="indefinite" additive="sum"/>
        <path d="M-2,-3 C-13,-11 -22,-9 -29,-2" stroke="#3B0F1E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M-3,2 C-15,4 -23,10 -27,18" stroke="#3B0F1E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M2,-3 C13,-11 22,-9 29,-2" stroke="#3B0F1E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M3,2 C15,4 23,10 27,18" stroke="#3B0F1E" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="2" r="11" fill="#8C2F39"/>
        <circle cx="0" cy="-9" r="6.5" fill="#6E1E33"/>
        <circle cx="-3" cy="-10" r="1.3" fill="#F5E9DE"/>
        <circle cx="3" cy="-10" r="1.3" fill="#F5E9DE"/>
        <path d="M-7,-17 L-1,-13.5 L-7,-10 Z" fill="#E8B4BC"/>
        <path d="M7,-17 L1,-13.5 L7,-10 Z" fill="#E8B4BC"/>
        <circle cx="0" cy="-13.5" r="1.7" fill="#C9A66B"/>
      </g>
    </g>
  </g>

  <!-- little "hi" note -->
  <text x="600" y="98" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="16" fill="#E8B4BC" opacity="0.85" transform="rotate(-2 600 98)">hi, i'm</text>

  <!-- name -->
  <text x="600" y="172" text-anchor="middle" font-family="Verdana, 'Trebuchet MS', sans-serif" font-size="60" font-weight="700" fill="url(#nameGrad)" letter-spacing="1" filter="url(#softShadow)">Urwah Imtiaz</text>

  <use href="#star4s" x="330" y="163" opacity="0.9"/>
  <use href="#star4s" x="870" y="163" opacity="0.9"/>

  <!-- subtitle, hand-lettered feel -->
  <text x="600" y="215" text-anchor="middle" font-family="'Segoe Print','Bradley Hand',cursive" font-size="22" fill="#F0D2C9" transform="rotate(-1.5 600 215)">Creative Frontend Developer</text>

  <!-- tagline with blinking cursor -->
  <text x="600" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#C9A66B">React &#183; Next.js &#183; GSAP &#183; Three.js &#183; WebGL<tspan fill="#E8B4BC">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- bottom hairline -->
  <line x1="470" y1="284" x2="730" y2="284" stroke="#C9A66B" stroke-opacity="0.35" stroke-width="1"/>
</svg>
