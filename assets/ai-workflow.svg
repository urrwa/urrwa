<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wfbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0A12"/>
      <stop offset="100%" stop-color="#241119"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A1620"/>
      <stop offset="100%" stop-color="#1B0F16"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C2F39"/>
      <stop offset="100%" stop-color="#C9A66B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" rx="10" fill="url(#wfbg)"/>
  <rect x="1" y="1" width="998" height="228" rx="10" fill="none" stroke="#6B4226" stroke-opacity="0.6"/>

  <text x="28" y="34" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#C9A66B">CURRENT AI WORKFLOW</text>
  <text x="28" y="54" font-family="Georgia, serif" font-size="12" fill="#B79C8C">how an idea becomes a shipped, reviewed interface</text>

  <g font-family="'Courier New', monospace" font-size="10">
    <rect x="838" y="20" width="134" height="22" rx="11" fill="#3B0F1E" stroke="#E8B4BC" stroke-opacity="0.5"/>
    <circle cx="852" cy="31" r="3" fill="#E8B4BC"/>
    <text x="862" y="35" fill="#E8B4BC" letter-spacing="1">PIPELINE ACTIVE</text>
  </g>

  <line x1="28" y1="66" x2="972" y2="66" stroke="#6B4226" stroke-opacity="0.5"/>

  <!-- 4 step cards -->
  <g font-family="'Courier New', monospace">
    <!-- card template positions -->
    <!-- Step 1 -->
    <g transform="translate(28,86)">
      <rect width="220" height="120" rx="8" fill="url(#cardGrad)" stroke="#6B4226" stroke-opacity="0.5"/>
      <text x="16" y="24" font-size="10" fill="#8C6A56">01</text>
      <text x="16" y="46" font-size="17" font-weight="bold" fill="#F5E8DC">Plan</text>
      <text x="16" y="66" font-size="10" fill="#B79C8C">Spec, architecture</text>
      <text x="16" y="80" font-size="10" fill="#B79C8C">and edge cases</text>
      <rect x="16" y="92" width="52" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="42" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">Claude</text>
    </g>

    <!-- connector -->
    <circle cx="270" cy="146" r="4" fill="url(#chipGrad)"/>

    <!-- Step 2 -->
    <g transform="translate(280,86)">
      <rect width="220" height="120" rx="8" fill="url(#cardGrad)" stroke="#6B4226" stroke-opacity="0.5"/>
      <text x="16" y="24" font-size="10" fill="#8C6A56">02</text>
      <text x="16" y="46" font-size="17" font-weight="bold" fill="#F5E8DC">Build</text>
      <text x="16" y="66" font-size="10" fill="#B79C8C">Components, motion</text>
      <text x="16" y="80" font-size="10" fill="#B79C8C">and state wiring</text>
      <rect x="16" y="92" width="54" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="43" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">Cursor</text>
      <rect x="76" y="92" width="34" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="93" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">v0</text>
    </g>

    <circle cx="522" cy="146" r="4" fill="url(#chipGrad)"/>

    <!-- Step 3 -->
    <g transform="translate(532,86)">
      <rect width="220" height="120" rx="8" fill="url(#cardGrad)" stroke="#6B4226" stroke-opacity="0.5"/>
      <text x="16" y="24" font-size="10" fill="#8C6A56">03</text>
      <text x="16" y="46" font-size="17" font-weight="bold" fill="#F5E8DC">Review</text>
      <text x="16" y="66" font-size="10" fill="#B79C8C">Refactor, a11y pass</text>
      <text x="16" y="80" font-size="10" fill="#B79C8C">and perf budget</text>
      <rect x="16" y="92" width="80" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="56" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">Claude Code</text>
    </g>

    <circle cx="774" cy="146" r="4" fill="url(#chipGrad)"/>

    <!-- Step 4 -->
    <g transform="translate(784,86)">
      <rect width="188" height="120" rx="8" fill="url(#cardGrad)" stroke="#6B4226" stroke-opacity="0.5"/>
      <text x="16" y="24" font-size="10" fill="#8C6A56">04</text>
      <text x="16" y="46" font-size="17" font-weight="bold" fill="#F5E8DC">Ship</text>
      <text x="16" y="66" font-size="10" fill="#B79C8C">Preview, deploy</text>
      <text x="16" y="80" font-size="10" fill="#B79C8C">and measure</text>
      <rect x="16" y="92" width="58" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="45" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">Vercel</text>
      <rect x="80" y="92" width="60" height="18" rx="9" fill="#3B0F1E" stroke="#8C2F39"/>
      <text x="110" y="104" font-size="9" fill="#E8B4BC" text-anchor="middle">Actions</text>
    </g>
  </g>

  <circle cx="16" cy="220" r="2.4" fill="#E8B4BC"/>
  <text x="26" y="223" font-family="Georgia, serif" font-style="italic" font-size="10.5" fill="#B79C8C">AI drafts, I decide — every generated line gets read, shaped and owned.</text>
</svg>
