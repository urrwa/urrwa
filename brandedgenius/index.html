<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branded Genius — AI automation that delivers results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050b17; --bg2:#0a1a30; --ink:#f3f6fb; --mute:#a9b4c6; --sky:#4db8f0; --blue:#1d6fd1; --line:rgba(160,190,230,.16);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}

/* ---------- header (unchanged items) ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,5vw,100px);
  opacity:0;transform:translateY(-16px);animation:in 1.2s var(--ease) .4s forwards}
.logo img{height:52px;display:block;border-radius:10px}
.menu{display:flex;gap:4px;padding:7px;border:1px solid var(--line);border-radius:16px;background:rgba(7,16,32,.55);backdrop-filter:blur(14px)}
.menu a{padding:13px 22px;border-radius:10px;font-size:17px;font-weight:400;color:var(--mute);transition:color .4s,background .4s}
.menu a:hover{color:#fff;background:rgba(77,184,240,.08)}
.menu a.on{color:#fff}
.cta{display:inline-flex;align-items:center;gap:12px;padding:19px 30px;border-radius:14px;font-size:17px;font-weight:500;
  background:linear-gradient(180deg,#2a7fe0,#165fb8);border:1px solid rgba(120,180,255,.35);position:relative;overflow:hidden;transition:box-shadow .6s var(--ease),transform .6s var(--ease)}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 4.5s ease-in-out 2s infinite}
.cta:hover{box-shadow:0 10px 40px -8px rgba(77,184,240,.7);transform:translateY(-2px)}
.cta svg{transition:transform .5s var(--ease)}.cta:hover svg{transform:translateX(5px)}
@keyframes sheen{0%,60%{left:-60%}100%{left:140%}}
@keyframes in{to{opacity:1;transform:none}}
@media(max-width:1000px){.menu{display:none}.cta{padding:14px 18px;font-size:15px}}

/* ---------- hero: pinned scene driven by scroll ---------- */
.track{height:240vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;
  background:radial-gradient(ellipse 60% 70% at 50% 45%,#0c2244 0%,var(--bg) 72%)}
#net{position:absolute;inset:0;width:100%;height:100%}

/* arch portrait */
.arch-wrap{position:absolute;left:50%;top:15vh;width:min(30vw,400px);min-width:250px;height:64vh;transform:translateX(-50%);perspective:1200px;z-index:2}
.arch{position:absolute;inset:0;border-radius:999px 999px 28px 28px;overflow:hidden;border:1px solid rgba(120,180,255,.28);
  box-shadow:0 0 90px -10px rgba(40,130,230,.55),inset 0 0 60px rgba(5,11,23,.5);
  clip-path:inset(100% 0 0 0 round 999px 999px 28px 28px);animation:reveal 1.8s var(--ease) .7s forwards;will-change:transform}
@keyframes reveal{to{clip-path:inset(0 0 0 0 round 999px 999px 28px 28px)}}
.arch img{width:100%;height:112%;object-fit:cover;object-position:50% 12%;display:block;transform:scale(1.25);animation:zoom 2.6s var(--ease) .7s forwards}
@keyframes zoom{to{transform:scale(1)}}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,11,23,.85),transparent 45%)}
.ring{position:absolute;inset:-26px;border-radius:999px 999px 36px 36px;border:1px dashed rgba(77,184,240,.35);animation:fade 2s 1.8s both;pointer-events:none}
@keyframes fade{from{opacity:0}}

/* rotating badge */
.badge{position:absolute;right:-70px;top:12%;width:140px;height:140px;z-index:3;opacity:0;animation:fade 1.4s 2s forwards}
.badge svg{width:100%;height:100%;animation:spin 18s linear infinite}
.badge::after{content:"↗";position:absolute;inset:0;display:grid;place-items:center;font-size:30px;color:var(--sky)}
@keyframes spin{to{transform:rotate(360deg)}}
.badge text{font-size:11.5px;letter-spacing:.22em;fill:var(--mute);font-weight:400;text-transform:uppercase}

/* flanks */
.flank{position:absolute;z-index:3;top:34vh;opacity:0;animation:in 1.4s var(--ease) 1.8s forwards}
.flank.l{left:clamp(20px,5vw,100px);max-width:260px}
.flank.r{right:clamp(20px,5vw,100px);max-width:350px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:16px 22px;border:1px solid var(--line);border-radius:6px;font-size:18px;font-weight:400;color:var(--mute);background:rgba(7,16,32,.45);backdrop-filter:blur(8px)}
.chip b{width:8px;height:8px;border-radius:50%;background:var(--sky);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(77,184,240,.6)}70%,100%{box-shadow:0 0 0 12px rgba(77,184,240,0)}}
.dots{display:flex;gap:10px;margin-top:30px}
.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.3);position:relative;overflow:hidden}
.dots i:first-child{width:46px}
.dots i:first-child::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 6s linear infinite}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.flank.r p{font-size:clamp(16px,1.25vw,21px);line-height:1.55;color:var(--mute)}

/* giant headline, overlaps arch */
.hl{position:absolute;left:0;right:0;bottom:7vh;z-index:4;text-align:center;font-weight:500;font-size:clamp(34px,6.4vw,118px);line-height:.98;letter-spacing:-.035em;pointer-events:none}
.hl .row{display:block;white-space:nowrap;will-change:transform,opacity}
.hl .row:first-child{color:var(--sky)}
.hl .row .c{display:inline-block;transform:translateY(120%);opacity:0;animation:rise 1.4s var(--ease) forwards}
.hl .row{overflow:hidden;padding-bottom:.1em;margin-bottom:-.06em}
@keyframes rise{to{transform:none;opacity:1}}

.hint{position:absolute;left:50%;bottom:2.4vh;z-index:4;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);transform:translateX(-50%);opacity:0;animation:fade 1s 3s forwards}

@media(max-width:1000px){
  .arch-wrap{width:62vw;top:16vh;height:46vh}
  .flank.l{display:none}
  .flank.r{top:auto;bottom:24vh;left:20px;right:20px;max-width:none;text-align:center}
  .flank.r p{font-size:15px}
  .badge{display:none}
  .hl{font-size:9vw;bottom:9vh}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>

<header>
  <a class="logo" href="#"><img src="logo-crop.png" alt="Branded Genius"></a>
  <nav class="menu">
    <a class="on" href="#">Homepage</a><a href="#">Services</a><a href="#">Use Cases</a><a href="#">AI Workshop</a><a href="#">About Us</a><a href="#">contact</a>
  </nav>
  <a class="cta" href="#">Request an AI potential analysis
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</header>

<div class="track" id="track">
  <section class="stage">
    <canvas id="net"></canvas>

    <div class="arch-wrap" id="aw">
      <div class="ring"></div>
      <div class="arch" id="arch"><img src="person.jpg" alt=""></div>
      <div class="badge"><svg viewBox="0 0 140 140"><defs><path id="c" d="M70,70 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs><text><textPath href="#c">AI agents · Workflows · Automation ·</textPath></text></svg></div>
    </div>

    <div class="flank l"><div class="chip"><b></b>AI Agents &amp; Workflows</div><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="flank r"><p>Branded Genius develops AI agents, automations and intelligent workflows for marketing, sales, customer service and internal processes – from potential analysis to implementation.</p></div>

    <h1 class="hl" id="hl">
      <span class="row" data-t="AI automation"></span>
      <span class="row" data-t="that delivers results"></span>
    </h1>
    <div class="hint">Scroll</div>
  </section>
</div>

<script>
// split headline into letters that rise in one by one
document.querySelectorAll('.hl .row').forEach((r,ri)=>{
  [...r.dataset.t].forEach((ch,i)=>{const s=document.createElement('span');s.className='c';s.textContent=ch===' '?' ':ch;
    s.style.animationDelay=(1.0+ri*.35+i*.03)+'s';r.appendChild(s)})});

const track=document.getElementById('track'),arch=document.getElementById('arch'),aw=document.getElementById('aw'),
      rows=[...document.querySelectorAll('.hl .row')],flanks=document.querySelectorAll('.flank');
let P=0,tiltX=0,tiltY=0,mx=.5,my=.5;

// scroll: headline splits apart, arch grows, flanks fade
function onScroll(){
  const max=track.offsetHeight-innerHeight;P=Math.min(Math.max(scrollY/max,0),1);
  const e=1-Math.pow(1-P,3);
  rows[0].style.transform=`translateX(${-e*22}vw)`;rows[1].style.transform=`translateX(${e*22}vw)`;
  rows.forEach(r=>r.style.opacity=1-e*1.15);
  flanks.forEach(f=>{f.style.animation='none';f.style.opacity=Math.max(1-e*2.4,0)});
  document.querySelector('.hint').style.opacity=1-e*3;
  aw.style.transform=`translateX(-50%) scale(${1+e*.28}) translateY(${e*-3}vh)`;
}
addEventListener('scroll',onScroll,{passive:true});onScroll();

// mouse: 3D tilt on the portrait
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
(function tilt(){tiltX+=((my-.5)*-8-tiltX)*.06;tiltY+=((mx-.5)*10-tiltY)*.06;
  arch.style.transform=`rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;requestAnimationFrame(tilt)})();

// live agent network: nodes around the portrait, pulses travel between them
const cv=document.getElementById('net'),g=cv.getContext('2d');
const LABELS=['Marketing','Sales','Support','Processes','CRM','Email','Data','Agents','Chatbot','Leads'];
let W,H,D,N=[],E=[],pulses=[];
function build(){D=devicePixelRatio||1;W=cv.width=cv.offsetWidth*D;H=cv.height=cv.offsetHeight*D;
  const cx=W/2,cy=H*.47,rx=Math.min(W*.27,520*D),ry=H*.36;
  N=LABELS.map((l,i)=>{const a=i/LABELS.length*Math.PI*2-Math.PI/2;
    return{l,a,bx:cx+Math.cos(a)*rx*(i%2?1:.78),by:cy+Math.sin(a)*ry*(i%2?1:.86),ph:Math.random()*6.28,hot:0}});
  E=[];N.forEach((n,i)=>{E.push([i,(i+1)%N.length]);if(i%3===0)E.push([i,(i+3)%N.length])});
  cvc=[cx,cy]}
let cvc;build();addEventListener('resize',build);
function pos(n,t){return[n.bx+Math.cos(t/2600+n.ph)*10*D,n.by+Math.sin(t/2100+n.ph)*10*D]}
function draw(t){g.clearRect(0,0,W,H);
  const fade=1-Math.min(P*1.6,1);g.globalAlpha=fade;
  E.forEach(([a,b])=>{const A=pos(N[a],t),B=pos(N[b],t);g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.strokeStyle='rgba(77,184,240,.17)';g.lineWidth=D;g.stroke()});
  if(Math.random()<.06){const e=E[Math.random()*E.length|0];pulses.push({e,p:0,s:.006+Math.random()*.008})}
  pulses=pulses.filter(u=>u.p<1);pulses.forEach(u=>{u.p+=u.s;const A=pos(N[u.e[0]],t),B=pos(N[u.e[1]],t),x=A[0]+(B[0]-A[0])*u.p,y=A[1]+(B[1]-A[1])*u.p;
    g.beginPath();g.arc(x,y,3*D,0,6.28);g.fillStyle='#8fd6ff';g.shadowColor='#4db8f0';g.shadowBlur=18*D;g.fill();g.shadowBlur=0;
    if(u.p>.97)N[u.e[1]].hot=1});
  N.forEach(n=>{const[x,y]=pos(n,t);
    const dx=x/D/innerWidth-mx,dy=y/D/innerHeight-my,near=Math.max(0,1-Math.hypot(dx,dy)*3.2);
    n.hot=Math.max(n.hot*.95,near);
    g.beginPath();g.arc(x,y,(4+n.hot*5)*D,0,6.28);g.fillStyle=`rgba(77,184,240,${.5+n.hot*.5})`;g.shadowColor='#4db8f0';g.shadowBlur=(8+n.hot*24)*D;g.fill();g.shadowBlur=0;
    g.beginPath();g.arc(x,y,(11+n.hot*6)*D,0,6.28);g.strokeStyle=`rgba(77,184,240,${.18+n.hot*.5})`;g.lineWidth=D;g.stroke();
    g.font=`${12*D}px Outfit,sans-serif`;g.fillStyle=`rgba(200,225,250,${.45+n.hot*.55})`;
    const right=Math.cos(n.a)>=0;g.textAlign=right?'left':'right';g.fillText(n.l.toUpperCase().split('').join(' '),x+(right?20:-20)*D,y+4*D)});
  g.globalAlpha=1;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script>
</body>
</html>
